# Auto-deploys menubase.io when code lands on the v2 branch
# (v2 is the production branch, see project memory)
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - v2
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEDUSA_MVP }}
          channelId: live
          projectId: medusa-mvp

      # IndexNow auto-ping after successful deploy. Tells Bing / Yandex /
      # Seznam / Naver to re-fetch the sitemap. Discovery happens within
      # minutes instead of waiting for organic crawl.
      # Protocol: https://www.indexnow.org/
      # Key file: https://menubase.io/mb20260601f3a8b2c1d4e6f7a9b0c2d4e6.txt
      - name: Ping IndexNow with sitemap + key hub pages
        if: success()
        run: |
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "menubase.io",
              "key": "mb20260601f3a8b2c1d4e6f7a9b0c2d4e6",
              "keyLocation": "https://menubase.io/mb20260601f3a8b2c1d4e6f7a9b0c2d4e6.txt",
              "urlList": [
                "https://menubase.io/",
                "https://menubase.io/sitemap.xml",
                "https://menubase.io/learn/",
                "https://menubase.io/academy/"
              ]
            }' || echo "IndexNow ping returned non-200 - not fatal, deploy already succeeded"
