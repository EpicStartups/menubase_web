# Auto-deploys menubase.io when code lands on the v2 branch
# (v2 is the production branch, see project memory)
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - v2
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEDUSA_MVP }}
          channelId: live
          projectId: medusa-mvp
