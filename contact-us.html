    <style>
      :root{
        /* theme.colors */
        --bg:#FFFFFF;
        --bgAlt:#F7F9FB;
        --text:#2F343A;
        --muted:#64748B;
        --primary:#C4E95A;
        --primaryDark:#A9D349;

        /* theme.radii */
        --r-sm:8px;
        --r-md:12px;
        --r-lg:16px;

        /* shadows */
        --shadow-sm:0 1px 2px rgba(15,23,42,0.04);
        --shadow-md:0 6px 20px rgba(15,23,42,0.06);
      }
      html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter, ui-sans-serif, system-ui;font-size:16px;line-height:1.6;}
      a{color:inherit;text-decoration:none}
      a:hover{text-decoration:underline}
      .container{max-width:var(--container);margin:0 auto;padding:0 24px}
      .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:var(--r-md);border:1px solid transparent;font-weight:600;line-height:1}
      .btn-filled{background:var(--primary);color:#0F172A}
      .btn-filled:hover{background:var(--primaryDark)}
      .btn-filled:active{background:var(--primaryDarker)}
      .btn-ghost{background:transparent;border-color:var(--border)}
      .btn-ghost:hover{background:#F1F5F9}
      .chip{display:inline-flex;align-items:center;gap:6px;background:#F2FCE5;border:1px solid #E0F3B3;color:var(--text);border-radius:999px;padding:6px 10px;font-size:12px}
      .section{padding:var(--sectionY) 0}
      .section.alt{background:var(--bgAlt)}
      .h1{font-size:44px;line-height:1.15;margin:12px 0 12px}
      .h2{font-size:32px;line-height:1.2;margin:0 0 16px}
      .muted{color:var(--muted)}
      .grid{display:grid;gap:var(--grid)}
      .two{grid-template-columns:1.1fr 1fr}
      .three{grid-template-columns:repeat(3,1fr)}
      .cards{display:grid;gap:var(--grid);grid-template-columns:repeat(3,1fr)}
      .card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
      /* Top ribbon (matches main site) */
      header.nav{position:sticky;top:0;background:rgba(255,255,255,0.85);backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--border);z-index:50}
      .nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
      .top-ribbon-login{padding:8px 14px;font-size:13px;font-weight:600;color:var(--text);border-radius:999px;border:1px solid var(--border)}
      .top-ribbon-login:hover{background:#F1F5F9;text-decoration:none}

      /* Floating bottom nav dock (matches main site sitewide) */
      nav.top {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        z-index: 50;
        background: rgba(26,26,26,0.92);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 999px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.25), 0 6px 16px rgba(0,0,0,0.15);
        max-width: calc(100vw - 24px);
      }
      nav.top .nav-inner { max-width: none; margin: 0; padding: 4px; display: flex; align-items: center; gap: 6px; height: auto; }
      nav.top .nav-links { display: flex; gap: 2px; padding-left: 6px; flex-direction: row; position: static; background: none; padding: 0; padding-left: 6px; transform: none; opacity: 1; pointer-events: auto; border: none; }
      nav.top .nav-links a {
        padding: 7px 11px; font-size: 13px; color: rgba(255,255,255,0.78);
        font-weight: 500; border-radius: 999px;
        transition: color 120ms, background 120ms;
        display: inline-flex; align-items: center; gap: 6px;
        width: auto; border-bottom: none;
      }
      nav.top .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.10); text-decoration: none; }
      nav.top .nav-links .nav-ico { width: 14px; height: 14px; flex: 0 0 14px; opacity: 0.85; display: block; }
      nav.top .nav-links a:hover .nav-ico { opacity: 1; color: #BCF125; }
      nav.top .nav-cta { display: flex; align-items: center; gap: 4px; margin-left: auto; }
      nav.top .nav-cta .btn.nav-wa-icon {
        width: 38px; height: 38px; padding: 0; border-radius: 999px;
        display: inline-flex; align-items: center; justify-content: center;
        flex: 0 0 auto; background: #BCF125; color: #1A1A1A; border: 0;
      }
      nav.top .nav-cta .btn.nav-wa-icon:hover { background: #A9D349; }
      nav.top .nav-cta .btn.nav-wa-icon svg { width: 18px; height: 18px; display: block; }
      body { padding-bottom: 80px; }

      .mobile-menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:8px;margin:-8px}
      .mobile-menu-toggle span{display:block;width:24px;height:2px;background:var(--text);margin:5px 0;transition:.3s}
      .mobile-menu-toggle.active span:nth-child(1){transform:rotate(45deg) translate(7px,7px)}
      .mobile-menu-toggle.active span:nth-child(2){opacity:0}
      .mobile-menu-toggle.active span:nth-child(3){transform:rotate(-45deg) translate(7px,-7px)}
      footer{border-top:1px solid var(--border);padding:40px 0}

      .contact-content p{margin:0 0 16px;line-height:1.7}
      .typeform-widget{margin-top:40px}

      /* responsive */
      @media (max-width:960px){
        .two,.three,.cards{grid-template-columns:1fr}
        .h1{font-size:34px}
        .h2{font-size:26px}
        .contact-content{padding:60px 24px}
        .contact-content h1{font-size:34px}
        .contact-content h2{font-size:20px}
      }
      @media (max-width:720px){
        nav.top { bottom:12px; left:10px; right:10px; transform:none; max-width:none; }
        nav.top .nav-inner { padding:4px; gap:0; justify-content:space-between; }
        nav.top .nav-links { flex:1; padding-left:4px; gap:0; justify-content:space-around; }
        nav.top .nav-links a { flex-direction:column; gap:2px; padding:6px 4px; font-size:9.5px; text-align:center; flex:1; }
        nav.top .nav-links .nav-ico { width:16px; height:16px; flex:0 0 16px; opacity:0.92; }
        nav.top .nav-cta { flex:0 0 auto; }
        body { padding-bottom: 90px; }
      }
    </style>
